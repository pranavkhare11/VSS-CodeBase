<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Meet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;

        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #a0a0a0;
            background-color: rgb(73, 73, 73);
        }

        .aside {
            width: 300px;
            background-color: rgb(19, 19, 19);
            padding: 5px 5px 30px 5px;
            display: flex;
            position: absolute;
            right: 0;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
        }

        .aside-body-inner {
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            background-color: #1e1f21;
            height: 100%;
        }

        .aside-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 5px 10px 5px 10px;
            color: #fff;
        }

        .aside-buttons-div {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            justify-content: center;
            color: #c4c4c4;
            font-size: 12px;
        }

        .aside-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 5px 10px;
            border-radius: 25px;
            background-color: #004a77;
            cursor: pointer;
        }

        .aside-buttons .button-svg {
            width: 20px;
            height: 20px;
        }

        .aside-search-bar-div {
            display: flex;
            align-items: center;
            margin: 10px 10px 0px 10px;
            padding: 5px 10px;
            border: 1px solid #7c7c7c;
            border-radius: 7.5px;
        }

        .hidden {
            display: none;
        }

        .add-participant-modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(32, 33, 36, 0.72);
            z-index: 1000;
        }

        .add-participant-modal.hidden {
            display: none;
        }

        .add-participant-panel {
            width: min(420px, calc(100% - 32px));
            padding: 18px;
            border: 1px solid #3c4043;
            border-radius: 14px;
            background-color: #202124;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }

        .add-participant-title {
            color: #e8eaed;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .add-participant-input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #5f6368;
            border-radius: 6px;
            background-color: #1e1f21;
            color: #e8eaed;
        }

        .add-participant-actions {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .panel-action-button {
            border: 1px solid #5f6368;
            background-color: #1e1f21;
            color: #e8eaed;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .panel-action-button.primary {
            border-color: #1a73e8;
            background-color: #1a73e8;
            color: #fff;
        }

        .aside-search-bar {
            padding: 5px 10px;

            border: none;
            background-color: #1e1f21;
            color: #e2e2e2;
        }

        .aside-search-bar>.search-svg {
            width: 16px;
            height: 16px;
        }

        input::placeholder {
            color: #7c7c7c;
        }

        input:focus {
            outline: none;
        }

        .list-lable {
            color: #c4c4c4;
            margin: 10px 10px 0px 10px;
            font-size: 12px;
        }


        .participant-list {

            border: 1px solid #7c7c7c;
            border-radius: 7.5px;
            margin: 10px 5px 10px 5px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #c4c4c4;
            padding: 10px 10px;
            border-bottom: 1px solid #7c7c7c;
            transition: border-bottom-color 0.35s ease;
        }

        .participant-list.collapsed .list-header {
            border-bottom-color: transparent;
        }

        .list-header-left {
            font-size: 12px;
        }

        .list-header-right {
            display: flex;
            align-items: center;
            gap: 17.5px;
            margin-right: 5px;
            font-weight: bold;
        }

        .fa-angle-up {
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.35s ease;
        }

        .svg-icons {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        .participant-list-body {
            max-height: 360px;
            overflow-y: auto;
            scrollbar-width: none;
            transition: max-height 0.35s ease;
        }

        .participant-list-body.collapsed {
            max-height: 0;
            overflow: hidden;
        }

        .fa-angle-up.collapsed {
            transform: rotate(180deg);
        }


        .participant {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            color: #e8eaed;
        }

        .participant-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .participant-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .menu-icon-button {
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            padding: 0;
            border-radius: 4px;
        }

        .menu-icon-button:hover {
            background-color: #2b2c2f;
        }

        .menu-icon-button:focus-visible {
            outline: 1px solid #8ab4f8;
            outline-offset: 1px;
        }

        .participant-actions {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            display: none;
            flex-direction: column;
            min-width: 110px;
            background-color: #2a2b2e;
            border: 1px solid #5f6368;
            border-radius: 8px;
            padding: 4px;
            z-index: 20;
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.35);
        }

        .participant-actions.is-open {
            display: flex;
        }

        .participant-action-button {
            border: none;
            background: transparent;
            color: #e8eaed;
            text-align: left;
            padding: 7px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .participant-action-button:hover {
            background-color: #3a3b3e;
        }

        .participant-action-button.remove {
            color: #ff9d9d;
        }

        .pinned-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid #5cbf6d;
            background-color: #1f4f2b;
            color: #9af0aa;
            font-size: 11px;
            line-height: 1;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .pinned-indicator-icon {
            width: 12px;
            height: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .pinned-indicator-icon svg {
            fill: currentColor;
        }


        .participant-profile {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .participant-name {
            font-size: 12px;
            color: #d7d7d7;
        }

        svg {
            width: 100%;
            height: 100%;
            fill: #d1d1d1;
        }
    </style>
</head>

            </path>
            <path
                d="m9.486 10.607 -0.748 -0.748A2 2 0 0 1 6 8v-0.878l-1 -1V8a3 3 0 0 0 4.486 2.607m-7.84 -9.253 12 12 0.708 -0.708 -12 -12z"
                stroke-width="1">
            </path>
        </svg>
    `;
    const menuIconMarkup = `
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#000000" class="bi bi-three-dots-vertical">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_iconCarrier">
                <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"></path>
            </g>
        </svg>
    `;
    const pinIconMarkup = `
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M10.5 1.5a1 1 0 0 1 .9 1.4l-.7 1.5 1.8 1.8c.4.4.1 1-.5 1h-3l-1.5 2.2V14c0 .3-.4.5-.6.3l-1.2-1.2a.5.5 0 0 1-.1-.6l1.1-2.2-2.4-2.4h-2c-.6 0-.9-.7-.5-1.1l1.8-1.8-.7-1.5a1 1 0 0 1 .9-1.4h6.7z"></path>
        </svg>
    `;

    function getInitial(name) {
        return name.trim().charAt(0).toUpperCase();
    }

    function getColorFromName(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return avatarColors[Math.abs(hash) % avatarColors.length];
    }

    function formatParticipantName(name) {
        return name
            .split(" ")
            .filter(Boolean)
            .map((part) => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase())
            .join(" ");
    }

    function createSvgTemplate(markup) {
        const template = document.createElement("template");
        template.innerHTML = markup.trim();
        return template.content.firstElementChild;
    }

    const matchedName = (arr, char) => {
        return arr.filter((item) => item.searchValue.includes(char));
    };

    const micMuteIconTemplate = createSvgTemplate(micMuteIconMarkup);
    const menuIconTemplate = createSvgTemplate(menuIconMarkup);
    const pinIconTemplate = createSvgTemplate(pinIconMarkup);

    let participantsData = names.map((name, index) => ({
        id: index,
        order: index,
        pinned: false,
        rawName: name,
        searchValue: name.toLowerCase(),
        displayName: formatParticipantName(name),
        initial: getInitial(name),
        avatarColor: getColorFromName(name)
    }));
    let nextParticipantId = participantsData.length;
    let nextParticipantOrder = participantsData.length;
    const adminNameKey = "vidhyaskillschool";

    function updateParticipantCount() {
        participantCount = participantsData.length;
        participantCountElement.textContent = participantCount;
    }

    updateParticipantCount();

    function closeAllActionMenus() {
        const openMenus = document.querySelectorAll(".participant-actions.is-open");
        openMenus.forEach((menu) => menu.classList.remove("is-open"));
    }

    function getNameComparisonKey(name) {
        return name.toLowerCase().replace(/[^a-z]/g, "");
    }

    function isAdminParticipant(participant) {
        return getNameComparisonKey(participant.rawName).includes(adminNameKey);
    }

    function getSortableParticipantName(participant) {
        return participant.rawName.replace(/\(.*?\)/g, "").trim().toLowerCase();
    }

    function sortParticipantsForDisplay(participantEntries) {
        return [...participantEntries].sort((a, b) => {
            const aIsAdmin = isAdminParticipant(a);
            const bIsAdmin = isAdminParticipant(b);
            if (aIsAdmin !== bIsAdmin) {
                return Number(bIsAdmin) - Number(aIsAdmin);
            }

            if (a.pinned !== b.pinned) {
                return Number(b.pinned) - Number(a.pinned);
            }

            const nameComparison = getSortableParticipantName(a).localeCompare(getSortableParticipantName(b), undefined, {
                sensitivity: "base"
            });
            if (nameComparison !== 0) {
                return nameComparison;
            }

            return a.order - b.order;
        });
    }

    function removeParticipantById(participantId) {
        participantsData = participantsData.filter((participant) => participant.id !== participantId);
        updateParticipantCount();
        renderCurrentParticipants();
    }

    function setParticipantPinnedState(participantId, shouldPin) {
        const participant = participantsData.find((entry) => entry.id === participantId);
        if (participant) {
            participant.pinned = shouldPin;
        }
        renderCurrentParticipants();
    }

    function addParticipantByName(nameInput) {
        const trimmedValue = nameInput.trim();
        if (!trimmedValue) {
            return false;
        }

        const participant = {
            id: nextParticipantId++,
            order: nextParticipantOrder++,
            pinned: false,
            rawName: trimmedValue,
            searchValue: trimmedValue.toLowerCase(),
            displayName: formatParticipantName(trimmedValue),
            initial: getInitial(trimmedValue),
            avatarColor: getColorFromName(trimmedValue)
        };

        participantsData.push(participant);
        updateParticipantCount();

        // Reset search so newly added participant is visible immediately.
        currentSearchText = "";
        searchInput.value = "";
        renderCurrentParticipants();

        return true;
    }

    function openAddParticipantPanel() {
        addParticipantModal.classList.remove("hidden");
        addParticipantInput.focus();
    }

    function closeAddParticipantPanel() {
        addParticipantModal.classList.add("hidden");
        addParticipantInput.value = "";
    }

    function createParticipantRow(participantData) {
        const participant = document.createElement("div");
        participant.classList.add("participant");
        participant.dataset.participantId = String(participantData.id);

        const leftSection = document.createElement("div");
        leftSection.classList.add("participant-left");

        const profile = document.createElement("div");
        profile.classList.add("participant-profile");
        profile.style.backgroundColor = participantData.avatarColor;
        profile.textContent = participantData.initial;

        const nameElement = document.createElement("div");
        nameElement.classList.add("participant-name");
        nameElement.textContent = participantData.displayName;

        leftSection.append(profile, nameElement);

        const rightSection = document.createElement("div");
        rightSection.classList.add("participant-right");

        const statusIndicator = document.createElement("div");
        if (participantData.pinned) {
            statusIndicator.classList.add("pinned-indicator");

            const pinIconHolder = document.createElement("span");
            pinIconHolder.classList.add("pinned-indicator-icon");
            pinIconHolder.appendChild(pinIconTemplate.cloneNode(true));

            const pinnedText = document.createElement("span");
            pinnedText.textContent = "Pinned";

            statusIndicator.append(pinIconHolder, pinnedText);
        } else {
            statusIndicator.classList.add("svg-icon");
            statusIndicator.appendChild(micMuteIconTemplate.cloneNode(true));
        }

        const menuIconButton = document.createElement("button");
        menuIconButton.type = "button";
        menuIconButton.classList.add("menu-icon-button", "svg-icons");
        menuIconButton.setAttribute("aria-label", "Open participant actions");
        menuIconButton.dataset.action = "toggle-menu";
        menuIconButton.appendChild(menuIconTemplate.cloneNode(true));

        const actionsMenu = document.createElement("div");
        actionsMenu.classList.add("participant-actions");

        const pinButton = document.createElement("button");
        pinButton.type = "button";
        pinButton.classList.add("participant-action-button");
        pinButton.textContent = participantData.pinned ? "Unpin" : "Pin";
        pinButton.dataset.action = "toggle-pin";

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.classList.add("participant-action-button", "remove");
        removeButton.textContent = "Remove";
        removeButton.dataset.action = "remove";

        actionsMenu.append(pinButton, removeButton);

        rightSection.append(statusIndicator, menuIconButton, actionsMenu);
        participant.append(leftSection, rightSection);

        return participant;
    }

    function getFilteredParticipants() {
        const sortedParticipants = sortParticipantsForDisplay(participantsData);
        if (currentSearchText === "") {
            return sortedParticipants;
        }
        return matchedName(sortedParticipants, currentSearchText);
    }

    function renderCurrentParticipants() {
        closeAllActionMenus();
        renderParticipants(getFilteredParticipants());
    }

    function renderParticipants(participantEntries) {
        participantList.textContent = "";

        const fragment = document.createDocumentFragment();
        participantEntries.forEach((participantData) => {
            fragment.appendChild(createParticipantRow(participantData));
        });
        participantList.appendChild(fragment);
    }

    function applyParticipantSearch(searchText) {
        currentSearchText = searchText.trim().toLowerCase();
        renderCurrentParticipants();
    }

    // Add initial participants
    renderCurrentParticipants();

    searchInput.addEventListener("input", (event) => {
        applyParticipantSearch(event.target.value);
    });

    participantList.addEventListener("click", (event) => {
        const actionElement = event.target.closest("[data-action]");
        if (!actionElement || !participantList.contains(actionElement)) {
            return;
        }

        const participantElement = actionElement.closest(".participant");
        if (!participantElement) {
            return;
        }

        const participantId = Number(participantElement.dataset.participantId);
        if (!Number.isInteger(participantId)) {
            return;
        }

        const action = actionElement.dataset.action;
        event.stopPropagation();

        if (action === "toggle-menu") {
            const actionsMenu = participantElement.querySelector(".participant-actions");
            if (!actionsMenu) {
                return;
            }

            const isOpen = actionsMenu.classList.contains("is-open");
            closeAllActionMenus();
            if (!isOpen) {
                actionsMenu.classList.add("is-open");
            }
            return;
        }

        if (action === "toggle-pin") {
            const participant = participantsData.find((entry) => entry.id === participantId);
            if (!participant) {
                return;
            }

            setParticipantPinnedState(participantId, !participant.pinned);
            return;
        }

        if (action === "remove") {
            removeParticipantById(participantId);
        }
    });

    addPeopleButton.addEventListener("click", (event) => {
        event.stopPropagation();
        openAddParticipantPanel();
    });

    addParticipantPanel.addEventListener("submit", (event) => {
        event.preventDefault();
        const wasAdded = addParticipantByName(addParticipantInput.value);
        if (wasAdded) {
            closeAddParticipantPanel();
        }
    });

    cancelAddParticipantButton.addEventListener("click", () => {
        closeAddParticipantPanel();
    });

    addParticipantPanel.addEventListener("click", (event) => {
        event.stopPropagation();
    });

    addParticipantModal.addEventListener("click", (event) => {
        if (event.target === addParticipantModal) {
            closeAddParticipantPanel();
        }
    });

    document.addEventListener("click", () => {
        closeAllActionMenus();
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            closeAddParticipantPanel();
        }
    });

    collapseArrow.addEventListener("click", () => {
        participantListBody.classList.toggle("collapsed");
        collapseArrow.classList.toggle("collapsed");
        participantBox.classList.toggle("collapsed");
    });

</script>


</html>
