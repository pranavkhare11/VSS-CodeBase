    <title>string-number</title>

    <script>

        console.log("string + number");
        let num1 = 10;
        let num2 = "10";
        console.log("   num1", num1);
        console.log("   num2", num2);
        console.log("       num1 + num2 =", num1 + num2);

        console.log("number + string");
        let num3 = 20;
        let num4 = "20";
        console.log("   num3", num3);
        console.log("   num4", num4);
        console.log("       num3 + num4 =", num3 + num4);

        console.log("string + string");
        let str1 = "Hello";
        let str2 = "World";
        console.log("   str1", str1);
        console.log("   str2", str2);
        console.log("       str1 + str2 =", str1 + str2);

        console.log("number + number");
        let num5 = 30;
        let num6 = 40;
        console.log("   num5", num5);
        console.log("   num6", num6);
        console.log("       num5 + num6 =", num5 + num6);

        console.log("number - string - number");
        let num7 = 50;
        let num8 = "50";
        let num9 = 10;
        console.log("   num7", num7);
        console.log("   num8", num8);
        console.log("   num9", num9);
        console.log("       num7 - num8 - num9 =", num7 - num8 - num9);
    </script>
