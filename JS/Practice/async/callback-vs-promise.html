    const safeDivide = (a, b, callback) => {
        setTimeout(() => {
            if (b === 0) {
                callback();
            } else {
                callback(null, a / b);
            }
        }, 1000);
    };

    safeDivide(10, 0, (err, result) => {

        console.log("Err", err);
