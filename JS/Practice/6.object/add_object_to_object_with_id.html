    const aggregateData = (allUsers, allOrders) => {
        const consolidatedResult = allUsers.map(user => ({ ...user }));
        consolidatedResult.forEach(user => {
            user.orders = [];
            allOrders.forEach(order => {
                if (order.userId === user.id) {
                    const { orderId, product, amount } = order;
                    user.orders.push({
                        orderId,
                        product,
                        amount
                    });
                };
            });
        });
        return consolidatedResult;
    };

    const mergedDataset = aggregateData(users, orders);
