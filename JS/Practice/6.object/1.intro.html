<script>

    const product = {
        Brand: "tata",
        Model: "Curve",
        Year: "2025",
        insurance: {
            Provider: "ICICI",
            PolicyNumber: "1234567890",
            ExpiryDate: "2025-12-31",
            status: function () {
                if (this.ExpiryDate > new Date().toISOString().split('T')[0]) {
                    return "Active";
                } else {
                    return "Inactive";
                }
            }
        }
    };
    console.log(product);

    product.Assessment = "totaled";
    product.Claim = "Partial";

    product.ToBeSalvaged = "true";
    product.isRegistered = "true";
    console.log(product);

    product.Year = "2024";
    console.log(product);

    delete product.isRegistered;
    console.log(product);
    console.log(product.insurance.status());
</script>
