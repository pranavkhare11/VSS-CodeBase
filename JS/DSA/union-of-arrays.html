<script>
    // no set usage and builtin functions
    const arr1 = [1, 2, 3, 4];
    const arr2 = [3, 4, 5, 6];

    const union = [];

    for (let i = 0; i < arr1.length; i++) {
        if (!union.includes(arr1[i])) {
            union.push(arr1[i]);
        }
    }

    for (let i = 0; i < arr2.length; i++) {
        if (!union.includes(arr2[i])) {
            union.push(arr2[i]);
        }
    }
    console.log(union);

    const unionSorted = [];

    const seen = {};

    for (const num of [...arr1, ...arr2]) {
        if (!(num in seen)) {
            seen[num] = true;
            unionSorted.push(num);
        }
    }

    console.log(unionSorted);

</script>
