<script>

    let num = 5;

    let result = 0;
    for (let i = 1; i <= num; i++) {
        result = result * 10 + i;
        console.log(result);
    }

    let result2 = 0;
    for (let i = 1; i <= num; i++) {
        result2 = result2 * 10 + 1;
        console.log(result2);
    }

    let result3 = 0;
    for (let i = 1; i <= num; i++) {
        result3 = result3 * 10 + i;
    }
    for (let i = num; i >= 1; i--) {
        console.log(result3);
        result3 = Math.floor(result3 / 10);
    }

    let result4 = 0;
    for (let i = num; i >= 1; i -= 2) {
        result4 = result4 * 10 + i;
    }
    for (let i = num; i >= 1; i -= 2) {
        console.log(result4);
        result4 = Math.floor(result4 / 10);
    }
