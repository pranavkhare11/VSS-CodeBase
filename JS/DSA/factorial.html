<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base: #2431b8;
            --bg-accent-blue: rgba(57, 120, 255, 0.34);
            --bg-accent-purple: rgba(140, 88, 255, 0.3);
            --bg-depth: #3a3fe1;
            --card-bg: rgba(240, 248, 255, 0.92);
            --card-border: rgba(255, 255, 255, 0.35);
            --text-dark: #111b2e;
            --button-start: #1c46ff;
            --button-mid: #3b3fff;
            --button-end: #0f2fdb;
            --danger: #d93025;
            --shadow-lg: 0 20px 45px rgba(10, 21, 96, 0.35);
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background:
                radial-gradient(circle at 18% 12%, var(--bg-accent-blue) 0%, transparent 40%),
                radial-gradient(circle at 88% 84%, var(--bg-accent-purple) 0%, transparent 35%),
                radial-gradient(circle at 58% 58%, rgba(255, 255, 255, 0.08) 0%, transparent 44%),
                linear-gradient(135deg, var(--bg-base) 0%, var(--bg-depth) 100%);
            color: var(--text-dark);
        }

        .viewport-layer {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            background: var(--card-bg);
            padding: 36px 34px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-lg);
            text-align: center;
            width: min(440px, 92vw);
            backdrop-filter: blur(2px);
        }

        .heading {
            margin-bottom: 18px;
            font-size: clamp(34px, 4vw, 52px);
            color: var(--text-dark);
            line-height: 1.08;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 15px;
            border: 1px solid #c6d4ea;
            border-radius: 8px;
            background-color: #ffffff;
            color: var(--text-dark);
            font-size: 20px;
            outline: none;
        }

        input:focus {
            border-color: #3f63ff;
            box-shadow: 0 0 0 3px rgba(60, 102, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--button-start) 0%, var(--button-mid) 55%, var(--button-end) 100%);
            color: white;
            font-size: 26px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.07);
        }

        #result {
            margin-top: 20px;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
            min-height: 38px;
            line-height: 1.2;
            word-break: break-word;
        }

        #result.error {
            color: var(--danger);
            font-size: 20px;
            font-weight: 500;
        }

        @media (max-width: 700px) {
            .container {
                padding: 28px 22px;
            }

            .heading {
                font-size: clamp(28px, 8vw, 40px);
            }

            input {
                font-size: 18px;
            }

            button {
                font-size: 21px;
            }

            #result {
                font-size: 26px;
            }
        }
    </style>

</head>

<body>

    <div class="viewport-layer">
        <div class="container">
            <h1 class="heading">Factorial Calculator</h1>
            <input type="text" id="numberInput" placeholder="Enter a number">
            <button id="submit">Validate &amp; Calculate</button>
            <p id="result"></p>
        </div>
    </div>

</body>

<script>
    let submitButton = document.getElementById('submit');
    let numberInput = document.getElementById('numberInput');
    let output = document.getElementById('result');

    submitButton.addEventListener('click', function () {
        let number = parseInt(numberInput.value);
        if (isNaN(number) || number < 0) {
            output.classList.add('error');
            output.textContent = "Enter a valid & a positive number.";
            return;
        }

        output.classList.remove('error');
        let originalNumber = number;
        let temp = 1;
        while (number > 1) {
            temp *= number;
            number--;
        }
        output.textContent = "Factorial of " + originalNumber + " is " + temp;
    })

</script>


</html>
