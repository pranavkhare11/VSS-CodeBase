    async function callApiPool() {
        const urls = [
            "https://httpbin.org/delay/0.12", "https://httpbin.org/delay/1.45", "https://httpbin.org/delay/0.88", "https://httpbin.org/delay/1.92", "https://httpbin.org/delay/0.34",

            "https://httpbin.org/delay/1.04", "https://httpbin.org/delay/0.17", "https://httpbin.org/delay/1.73", "https://httpbin.org/delay/0.38", "https://httpbin.org/delay/1.26",

            "https://httpbin.org/delay/1.37", "https://httpbin.org/delay/0.72", "https://httpbin.org/delay/1.61", "https://httpbin.org/delay/0.03", "https://httpbin.org/delay/1.15",

            "https://httpbin.org/delay/1.39", "https://httpbin.org/delay/0.79", "https://httpbin.org/delay/1.68", "https://httpbin.org/delay/0.07", "https://httpbin.org/delay/1.12",

            "https://httpbin.org/delay/1.31", "https://httpbin.org/delay/0.71", "https://httpbin.org/delay/1.69", "https://httpbin.org/delay/0.08", "https://httpbin.org/delay/1.16",
        ];

        const limit = 10; // Max number of simultaneous API calls
        let tasks = [];
        let lastid = 0;
        let responses = [];
        const activeTasks = new Set();
        const failedTasks = [];
        let isPoolRunning = false;
        let poolPromise = null;

        async function worker() {
            while (tasks.length > 0) {
                const { url, id } = tasks.shift();
                let response = null;

                activeTasks.add(id);
                console.log("Active APIs:", Array.from(activeTasks).sort((a, b) => a - b));

                try {
                    response = await fetch(url);
                    const data = await response.json();
                    console.log(`done ${id}`);
                    responses.push({ id, data });
                } catch (err) {
                    console.error(`failed ${id}`);
                    failedTasks.push(id);
                }
                activeTasks.delete(id);
                console.log("Active APIs:", Array.from(activeTasks).sort((a, b) => a - b));
            }
        }

        async function runPool() {
            isPoolRunning = true;
            const pool = Array.from({ length: limit }, () => worker());
            await Promise.all(pool);
            isPoolRunning = false;

            // If new tasks were enqueued while workers were winding down, run another round.
            if (tasks.length > 0) {
                return runPool();
            }
        }

        function enqueueUrls(urlList) {
            const newTasks = urlList.map((url, i) => ({ url, id: lastid + i + 1 }));
            lastid += urlList.length;

            if (isPoolRunning) {
                tasks.push(...newTasks);
                console.log(`Pool running. Added ${newTasks.length} APIs to queue.`);
            } else {
                tasks.push(...newTasks);
                console.log(`Pool idle. Added ${newTasks.length} APIs and started workers.`);
                poolPromise = runPool();
            }
        }

        // Expose helpers for manual testing from the DevTools console
        window.enqueueUrls = enqueueUrls;
        window.getQueueState = () => ({ isPoolRunning, tasksLength: tasks.length, lastid });
        window._responses = responses;

        enqueueUrls(urls);

        if (poolPromise) {
            await poolPromise;
        }

        console.log("Final API responses:", responses);
        console.log("Failed APIs:", Array.from(failedTasks).sort((a, b) => a - b));
    }
    callApiPool();
</script>
