<script>
    let arr=[1,"a",true,false];
    let arr2=[1,100,-10,1.1,0.1];

    Array.prototype.isStrict = function () {
        if (this.length === 0) return true;
        const firstType = typeof this[0];
        for (let i = 1; i < this.length; i++) {
            if (typeof this[i] !== firstType) {
                return false;
            }
        }
        return true;
    }

    console.log(arr.isStrict());
    console.log(arr2.isStrict());

</script>
